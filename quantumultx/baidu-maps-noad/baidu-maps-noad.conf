# baidu-maps-noad for Quantumult-X 1.8.0+
# v1.3.0 · 2026-09-28
# 去掉百度地图 (iOS v21.20.30) 开屏广告 + 首页圆形广告 + 横幅广告
# 机制: 纯 MITM SSL pin 失败 — 广告 SDK 跟 server 通讯被 Loon/QuantumultX CA 拦截
#
# 用法: 复制下方 [mitm] 段到你的 Quantumult-X 配置
# (QX X 1.8.0 把 hostname 从 [filter_local] 拆到独立 [mitm] section)

[mitm]
hostname = ecom.map.baidu.com, integralwall.baidu.com, afdconf.baidu.com, i.qchannel03.cn, nsclick.baidu.com, usr-api.yunxish.com, logrcv.yunxish.com
