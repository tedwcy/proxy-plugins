# baidu-maps-noad for QX (Quantumult X) 1.8.0+
# v1.1.0 · 2026-10-15
# 百度地图 (iOS V22 / v22.0.40.3) 去除开屏广告 + 主页顶部横幅 + 左上角广告入口
#
# 用法 (二选一):
#   1. "插入资源" 加载这个 URL — QX 自动解析
#   2. 粘贴内容到 QX 本地配置 (设置 → 配置 → 编辑)
#
# v1.1.0 覆盖范围 (从 v1.0.0 升级):
#   ✓ 开屏广告 (splash) — afd.baidu.com/afd/entry?action=query|update
#   ✓ 主页顶部横幅 "在？抽个 AirPods5" — newclient.map.baidu.com/client/phpui2/?qt=ads (banner card)
#   ✓ 主页左上角 "古今地图" 广告入口 — newclient.map.baidu.com/client/phpui2/?qt=ads (icon card)
#   + 主页推荐 / AI 卡片改写 (防御性, 即使新文案不出现也清掉空位)
#
# 关键设计 (跟 kantianxia-noad v1.0.3 同思路):
#   - 纯 prefix pattern, 无 (\?|$) anchor (QX X 远程 conf regex 不兼容, handoff §3)
#   - IIFE + strict mode + try/catch (QX JSCore 严格模式, 顶层 return 抛 Illegal return)
#   - hostname 同时加 *.map.baidu.com (通配) + afd.baidu.com + mbd.baidu.com
#     (即使脚本挂掉, SSL pin 失败仍能让 SDK 静默)
#
# v1.0.0 → v1.1.0 关键发现 (HAR: quantumult-x-2026-10-15-134411.har):
#   - 用户实测 4.5 分钟内反复冷启动百度地图, 仍然看到开屏 + 主页 banner + 古今地图
#   - 但 HAR 里 0 个 *.map.baidu.com 请求 — 说明百度地图 V22 核心 API 走 mTLS 强 SSL pin,
#     QX MITM 不接管 (afd.baidu.com / mbd.baidu.com 没强 pin, 所以抓到了)
#   - v1.0.0 hostname 缺 *.map.baidu.com, 是 v1.0.0 banner/古今地图 不生效的根本原因
#   - v1.1.0 修复: hostname 加 *.map.baidu.com 通配, 让 QX 接管所有 map.baidu.com HTTPS,
#     即使 plugin 改写失败, SSL pin 失败也能让 ad SDK 静默
#
# 升级 v1.1.0 后必须走清缓存流程 (handoff §3.6):
#   1. QX app → 设置 → 资源 → 找到 baidu-maps-noad → 删掉
#   2. 上滑杀掉 QX app
#   3. 重启 QX
#   4. 重新添加资源 URL
#   5. 杀掉 + 冷启动 百度地图 app (否则 splash 可能命中 app 本地缓存)

hostname = afd.baidu.com, mbd.baidu.com, newclient.map.baidu.com, client.map.baidu.com, api.map.baidu.com, ecom.map.baidu.com, *.map.baidu.com

# === 开屏广告: afd.baidu.com/afd/entry 改写 ===
# action=query  → 查询请求, 响应 699B, 含 res.splash (频控) + res.ad (空 list, empty_ad=1)
# action=update → 增量更新请求, 响应 1529B, 含 res.splash.empty_ext_info (base64 含 empty_ad 标志)
^https?:\/\/afd\.baidu\.com\/afd\/entry\?action=query url script-response-body https://raw.githubusercontent.com/tedwcy/proxy-plugins/main/quantumultx/baidu-maps-noad/baidu-maps-noad.js
^https?:\/\/afd\.baidu\.com\/afd\/entry\?action=update url script-response-body https://raw.githubusercontent.com/tedwcy/proxy-plugins/main/quantumultx/baidu-maps-noad/baidu-maps-noad.js

# === 主页广告卡片: newclient.map.baidu.com/client/phpui2/?qt=ads ===
# qt=ads 是 query type = ads, type=user_home_* 是各种主页卡片类型
# 这是顶部横幅"在？抽个 AirPods5" + 左上角"古今地图"的源头
# zip bundle 内 hardcode 这个 URL, JS 启动后直接 fetch
^https?:\/\/newclient\.map\.baidu\.com\/client\/phpui2\/\?qt=ads url script-response-body https://raw.githubusercontent.com/tedwcy/proxy-plugins/main/quantumultx/baidu-maps-noad/baidu-maps-noad.js

# === 主页推荐 / AI 卡片 (防御性) ===
# 拆成 2 条简单 pattern (避免 (\?|$) + 嵌套 alternation 触发 QX X 远程 conf regex bug, handoff §3)
# govui/cross_list_recommend — 跨列表推荐 (顶部 banner 候选)
# govui/aimode/query_rec    — AI 模式推荐 (可能藏 ad 卡片)
^https?:\/\/newclient\.map\.baidu\.com\/govui\/cross_list_recommend url script-response-body https://raw.githubusercontent.com/tedwcy/proxy-plugins/main/quantumultx/baidu-maps-noad/baidu-maps-noad.js
^https?:\/\/newclient\.map\.baidu\.com\/govui\/aimode\/query_rec url script-response-body https://raw.githubusercontent.com/tedwcy/proxy-plugins/main/quantumultx/baidu-maps-noad/baidu-maps-noad.js
^https?:\/\/newclient\.map\.baidu\.com\/llm-render\/get_ai_card url script-response-body https://raw.githubusercontent.com/tedwcy/proxy-plugins/main/quantumultx/baidu-maps-noad/baidu-maps-noad.js