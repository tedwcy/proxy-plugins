# bilibili-noad for QX (Quantumult X) 1.8.0+
# v1.0.1 · 2026-10-15 02:20
# 去掉 B站 (iOS) 开屏广告 (splash/list + splash/show)
#
# 用法 (二选一):
#   1. "插入资源" 加载这个 URL — QX 自动解析
#   2. 粘贴内容到 QX 本地配置 (设置 → 配置 → 编辑)
#
# 抓包来源: quantumult-x-2026-10-15-021759.har (iOS)
#   /x/v2/splash/list   → data.list[71] (splash 库存) + data.show[28] (当前激活)
#   /x/v2/splash/show   → data.show (上报用激活列表)
#
# 注意:
#   - splash/brand/list 不动 — 节日主题 (元旦/中秋) 是合法 UI, 不是广告
#   - splash/event/list2 不动 — 事件埋点, 不动
#   - 主机名 app.bilibili.com 自动通过 hostname 行 MITM
#   - 横幅广告 (视频详情页小卡片) 暂未覆盖, 等后续抓包后 v1.0.2+

hostname = app.bilibili.com

^https?:\/\/app\.bilibili\.com\/x\/v2\/splash\/(list|show)(\?|$) url script-response-body https://raw.githubusercontent.com/tedwcy/proxy-plugins/main/quantumultx/bilibili-noad/bilibili-noad.js
