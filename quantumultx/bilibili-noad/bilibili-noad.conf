# bilibili-noad for QX (Quantumult X) 1.8.0+
# v1.0.3 · 2026-10-15 14:30
# 去掉 B站 (iOS) 开屏广告 + 后台返回时的"VIP 商业化 tips"广告 + 广告追踪 ban
#
# 用法 (二选一):
#   1. "插入资源" 加载这个 URL — QX 自动解析
#   2. 粘贴内容到 QX 本地配置 (设置 → 配置 → 编辑)
#
# 抓包来源:
#   - quantumult-x-2026-10-15-021759.har (开屏策略验证)
#   - quantumult-x-2026-10-15-094400.har (tanx 广告域识别)
#   - quantumult-x-2026-10-15-134411-1.har (后台返回 tips 广告定位)
#
# 覆盖范围:
#   - 开屏广告: 清空 /x/v2/splash/list 的 data.list + data.show
#   - 后台返回 tips: reject-dict /x/vip/ads/material/report (ddgksf2013 标记 Material_Ad)
#   - 广告追踪: ban 阿里妈妈 tanx.com 的追踪 beacon
#
# 暂未覆盖:
#   - 视频详情页下方横幅广告 (i.e. 京东好物卡片)
#     原因: B 站的视频详情接口 (app.bilibili.com/bilibili.app.viewunite.v1.View/View)
#     走 protobuf, 当前 build_id 91400300 不下发 cm 字段, 横幅素材可能从
#     其它 gRPC 接口 (AIRelateAsync 等) 加载, 需 Charles / Surge stream decoder 进一步定位.
#
# 注意:
#   - splash/brand/list 不动 — 节日主题 (元旦/中秋) 是合法 UI, 不是广告
#   - splash/event/list2 不动 — 事件埋点, 不动
#   - 主机名 app.bilibili.com / api.bilibili.com 自动通过 hostname 行 MITM

hostname = app.bilibili.com, api.bilibili.com

# ban 阿里妈妈广告追踪 (1x1 gif beacon, ban 掉不影响视频播放)
^https?:\/\/(ef-dongfeng|df)\.tanx\.com\/ url reject-200

# 后台返回时的 VIP 商业化 tips 广告 (position_id=3, material_type=3)
# ddgksf2013 标记为 Material_Ad, reject-dict 让客户端拿不到空 dict 不渲染
# 注意: 这条是 POST 上报 + 下发双重角色, 真实机制 B 站未公开
^https?:\/\/api\.bilibili\.com\/x\/vip\/ads\/material\/report url reject-dict

# 开屏广告清除
^https?:\/\/app\.bilibili\.com\/x\/v2\/splash\/(list|show)(\?|$) url script-response-body https://raw.githubusercontent.com/tedwcy/proxy-plugins/main/quantumultx/bilibili-noad/bilibili-noad.js


