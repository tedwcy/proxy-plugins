; flightradar24 for Quantumult-X 1.8.0+
; v1.0.3 · 2026-09-28
; Flightradar24 Gold 订阅解锁 (365 天历史/去广告/无限追踪)
; 需先用免费账户登录
;
; 用法: 把 [rewrite_local] 段粘贴到 QX X 配置
; 主机名 mobile.flightradar24.com 需要在 QX X app UI 里手动添加
;       (设置 → HTTPS 解密 → 主机名 → 添加 mobile.flightradar24.com)
;
; 关键语法 (crossutility 官方 rewrite.md):
;   - URL pattern 在 [rewrite_local] 段
;   - 指令是 script-response-body (空格分隔, 不是 script-path=)
;   - [filter_local] 段不放 JS, 只放路由规则
;   - [mitm] 段不放 hostname, 在 app UI 里配置

[rewrite_local]
^https?:\/\/mobile\.flightradar24\.com\/mobile\/(user-session|\w{9}) url script-response-body https://raw.githubusercontent.com/tedwcy/proxy-plugins/main/quantumultx/flightradar24/flightradar24.js