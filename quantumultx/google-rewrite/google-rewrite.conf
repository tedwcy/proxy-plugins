# google-rewrite for Quantumult-X 1.8.0+
# v1.0.0 · 2026-09-28
# Google 搜索去区域跳转提示 (CN/HK/JP → google.com /ncr)
#
# 用法 (二选一):
#   1. "插入资源" 加载这个 URL — QX X 自动解析
#   2. 粘贴内容到 QX X 本地配置 (设置 → 配置 → 编辑)

^https?:\/\/(www\.)?(g|google)\.cn url 302 https://www.google.com
^https?:\/\/www\.google\.co\.jp url 302 https://www.google.com
^https?:\/\/www\.google\.com\.hk\/ url 302 https://www.google.com/ncr