# kantianxia-noad for Quantumult-X 1.8.0+
# v1.0.1 · 2026-09-28
# 去掉看天下 (VistaKTX / com.vistastory.VistaKTX) 开屏广告 + 弹窗广告
# 不影响其他接口
#
# 用法 (二选一):
#   1. "插入资源" 加载这个 URL — Quantumult-X 自动解析
#   2. 粘贴内容到 Quantumult-X 本地配置 (设置 → 配置 → 编辑)
#
# 与 loon/kantianxia-noad/ 叠加 (开屏 + 弹窗广告由 kantianxia-noad 去掉,
# VIP 权限由 quantumultx/vista/ 给)
#
# 关键修复 (2026-09-28):
#   早期 QX X 版用自己写的简化 .js, 顶部 IIFE 外有顶层 return → JSCore Illegal return
#   现在直接复用 Loon 版 .js, Loon 验证可用, JS 行为完全一致

hostname = ktx.cn

^https?:\/\/ktx\.cn\/v3\/api\/(index\/loading_ad2|adm\/get_popup_ad)(\?|$) url script-response-body https://raw.githubusercontent.com/tedwcy/proxy-plugins/main/loon/kantianxia-noad/kantianxia-noad.js
