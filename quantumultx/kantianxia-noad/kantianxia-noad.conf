# kantianxia-noad for Quantumult-X 1.8.0+
# v1.0.2 · 2026-09-28
# 去掉看天下 (VistaKTX) 开屏广告 + 弹窗广告
#
# 用法 (二选一):
#   1. "插入资源" 加载这个 URL — Quantumult-X 自动解析
#   2. 粘贴内容到 Quantumult-X 本地配置 (设置 → 配置 → 编辑)
#
# 关键修复 (2026-09-28 v1.0.2):
#   早期 pattern 用 `^https?:\/\/ktx\.cn\/v3\/api\/(index\/loading_ad2|adm\/get_popup_ad)(\?|$)`
#   → QX X 远程 conf regex 解析器对 `(\?|$)` 结尾 + 嵌套 alternation 兼容差, 整个 pattern 不匹配
#   → 脚本不被调用, ad 字段原样保留
#   → 拆成 2 条简单 pattern (跟 fr24 一样), 验证可用

hostname = ktx.cn

^https?:\/\/ktx\.cn\/v3\/api\/index\/loading_ad2 url script-response-body https://raw.githubusercontent.com/tedwcy/proxy-plugins/main/loon/kantianxia-noad/kantianxia-noad.js
^https?:\/\/ktx\.cn\/v3\/api\/adm\/get_popup_ad url script-response-body https://raw.githubusercontent.com/tedwcy/proxy-plugins/main/loon/kantianxia-noad/kantianxia-noad.js
