# kantianxia-noad for Quantumult-X 1.8.0+
# v1.0.3 · 2026-10-08
# 去掉看天下 (VistaKTX) 开屏广告 + 弹窗广告
#
# 用法 (二选一):
#   1. "插入资源" 加载这个 URL — Quantumult-X 自动解析
#   2. 粘贴内容到 Quantumult-X 本地配置 (设置 → 配置 → 编辑)
#
# 关键改动 (v1.0.3 · 2026-10-08):
#   - HAR (quantumult-x-2026-10-08-011951.har) 显示 raw.githubusercontent.com fetch 0 次
#     → 脚本完全没被 QX X 调用, plugin 失效
#   - 简化 pattern: 去掉所有 `(\?|$)` 收尾 anchor, 用纯 prefix match (跟 fr24 / umetrip 一致)
#   - 改用本地 .js 路径 (不复用 loon 路径), 避免跨目录引用歧义
#   - hostname 加 *.ktx.cn (兼容子域)
#
# 关键改动 (v1.0.2 · 2026-09-28):
#   - 早期 pattern 用 `(\?|$)` + 嵌套 alternation → QX X 远程 conf regex 不兼容
#   - 拆成 2 条简单 pattern
#
# 重要: 升级 v1.0.3 后必须走清缓存流程 (HANDOFF §3.6):
#   1. QX X app → 设置 → 资源 → 找到 kantianxia-noad → 删掉
#   2. 上滑杀掉 QX X app
#   3. 重启 QX X
#   4. 重新添加资源 URL

hostname = ktx.cn, *.ktx.cn

# 启动广告: loading_ad2 / loading_ad / splash / startup 系列
# 纯 prefix match, 不带结尾 anchor (跟 fr24 / umetrip / ddgksf2013 一致)
^https?:\/\/(.*\.)?ktx\.cn\/v3\/api\/index\/(loading_ad|loading_ad2|splash|startup) url script-response-body https://raw.githubusercontent.com/tedwcy/proxy-plugins/main/quantumultx/kantianxia-noad/kantianxia-noad.js

# 弹窗广告: adm/get_popup_ad / popup/get_popup_ad / index/dialog 系列
^https?:\/\/(.*\.)?ktx\.cn\/v3\/api\/(adm\/get_popup_ad|popup\/get_popup_ad|index\/dialog) url script-response-body https://raw.githubusercontent.com/tedwcy/proxy-plugins/main/quantumultx/kantianxia-noad/kantianxia-noad.js
