# kantianxia-noad for Quantumult-X 1.8.0+
# v1.0.0 · 2026-09-28
# 去掉看天下 (VistaKTX / com.vistastory.VistaKTX) 开屏广告 + 弹窗广告
# 不影响其他接口
#
# 用法 (二选一):
#   1. "插入资源" 加载这个 URL — QX X 自动解析
#   2. 粘贴内容到 QX X 本地配置 (设置 → 配置 → 编辑)
#
# 注意:
#   - popup/get_popups 端点本来 popups:[] 不动
#   - loading_ad2 和 get_popup_ad 两个端点都清空 body.ad / body.popup

hostname = ktx.cn

^https?:\/\/ktx\.cn\/v3\/api\/(index\/loading_ad2|adm\/get_popup_ad)(\?|$) url script-response-body https://raw.githubusercontent.com/tedwcy/proxy-plugins/main/quantumultx/kantianxia-noad/kantianxia-noad.js