# vista (Vista 看天下 VIP 解锁) for Quantumult-X 1.8.0+
# v1.0.19 · 2026-09-28
# 全文 + 首页 banner + 电纸刊按钮; 去红点处理 (server 决定)
# PDF 5 页根因: OSS PDF 文件本身只有 6 页对象, 不是 plugin 能解决的
#
# 用法 (二选一):
#   1. "插入资源" 加载这个 URL — QX X 自动解析
#   2. 粘贴内容到 QX X 本地配置 (设置 → 配置 → 编辑)
#
# 与 loon/kantianxia-noad/ 叠加 (开屏 + 弹窗广告由 kantianxia-noad 去掉,
# VIP 权限由这个 plugin 给)

hostname = ktx.cn, open3.vistastory.com

# http-request hook: 处理所有 ktx.cn/v3/api/ 请求 (改 isVip/isFree 等 flag)
^https?:\/\/ktx\.cn\/v3\/api\/ url script-request-body https://raw.githubusercontent.com/tedwcy/proxy-plugins/main/loon-vista/vista.js

# http-response hook: 处理具体 VIP 相关端点 (改 response JSON)
^https?:\/\/ktx\.cn\/v3\/api\/(vip\/|my\/home\/|article\/|magazine\/|index\/|popup\/|adm\/|featured\/|mag\/pdf\/) url script-response-body https://raw.githubusercontent.com/tedwcy/proxy-plugins/main/loon-vista/vista.js
