# spotify-t2s for Quantumult-X 1.8.0+
# v1.0.5 · 2026-09-28
# Spotify 繁体歌词 → 简体中文 (完整歌词 + 底部预览)
# OpenCC tw2s, 本地查表, 0 API/0 配额/0 secret
#
# 用法 (二选一):
#   1. "插入资源" 加载这个 URL — QX X 自动解析
#   2. 粘贴内容到 QX X 本地配置 (设置 → 配置 → 编辑)
#
# JS 直接引用 Loon 版 (同一 JavaScriptCore 运行时, 避免重复上传 2MB OpenCC 词典)

hostname = spclient.wg.spotify.com, *-spclient.spotify.com

^https?:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/color-lyrics\/v2\/track\/ url script-response-body https://raw.githubusercontent.com/tedwcy/proxy-plugins/main/loon/spotify-t2s/spotify-t2s.js