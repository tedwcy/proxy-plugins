# spotify-unlock for Quantumult-X 1.8.0+
# v1.0.3 · 2026-09-28
# Spotify Premium Unlock — 部分解锁 (基于 app2smile/rules 最新代码)
# 出现新校验端点时参考公开抓包迭代更新
#
# 用法 (二选一):
#   1. "插入资源" 加载这个 URL — QX X 自动解析
#   2. 粘贴内容到 QX X 本地配置 (设置 → 配置 → 编辑)
#
# JS 直接引用 Loon 版 (JSON + protobuf 两个脚本, 同一运行时)
#
# 注意: 韩国 IP 仍可能 4 秒停 (app 后端地区校验), 用美区 IP 绕过

hostname = spclient.wg.spotify.com, *-spclient.spotify.com

^https?:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(artistview\/v1\/artist|album-entity-view\/v2\/album)\/ url script-request-body https://raw.githubusercontent.com/tedwcy/proxy-plugins/main/loon/spotify-unlock/spotify-json.js

^https?:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize)$ url script-response-body https://raw.githubusercontent.com/tedwcy/proxy-plugins/main/loon/spotify-unlock/spotify-proto.js