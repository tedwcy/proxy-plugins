# umetrip-noad for QX (Quantumult X) 1.8.0+
# v1.0.0 · 2026-09-28
# 去掉航旅纵横 (iOS) 开屏广告
#
# 用法 (二选一):
#   1. "插入资源" 加载这个 URL — QX 自动解析
#   2. 粘贴内容到 QX 本地配置 (设置 → 配置 → 编辑)
#
# 机制: MITM + protobuf 响应改写. umestartup.umetrip.com 返回的
# gzip+protobuf 里嵌了 JSON 配置 blob, 脚本做等长度字符串替换
# (保持 protobuf 字符串 varint 长度不变, 结构合法)
#
# 替换字段 (3 个):
#   "adBlackList":"0"             → "adBlackList":"1"
#   "advertImageTimeout":"2000"   → "advertImageTimeout":"0000"
#   "advertTotalTimeout":"2500"   → "advertTotalTimeout":"0000"

hostname = umestartup.umetrip.com

^https?:\/\/umestartup\.umetrip\.com\/ url script-response-body https://raw.githubusercontent.com/tedwcy/proxy-plugins/main/quantumultx/umetrip-noad/umetrip-noad.js